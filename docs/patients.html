<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patients — MediCap</title>
  <meta name="description" content="Search sample patient records and current admission status." />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { brand: { indigo: '#005ea8', sky: '#005ea8', teal: '#147d64', amber: '#8a5700', red: '#b42318' } },
      fontFamily: {
        sans: ['IBM Plex Sans','ui-sans-serif','system-ui','sans-serif'], mono: ['IBM Plex Mono','ui-monospace','monospace'],
        display: ['IBM Plex Sans','ui-sans-serif','system-ui','sans-serif'], grotesk: ['IBM Plex Sans','ui-sans-serif','system-ui','sans-serif'],
      },
    } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>

<body class="min-h-screen antialiased">
  <main id="main-content" class="app-main">
    <header class="page-header">
      <div>
        <p class="eyebrow">Records / sample data</p>
        <h1 class="page-title">Patients</h1>
        <p class="page-intro">Search current and discharged demo records</p>
      </div>
    </header>

    <div class="records-toolbar">
      <label for="search" class="field-label">
        Patient name
        <span class="search-wrap">
          <i class="ri-search-line" aria-hidden="true"></i>
          <input id="search" type="search" placeholder="Search demo records…" class="field-control" />
        </span>
      </label>
      <label for="f-status" class="field-label">
        Admission status
        <select id="f-status" class="field-control">
          <option value="">All statuses</option><option>Admitted</option><option>Discharged</option>
        </select>
      </label>
    </div>

    <div class="table-shell">
      <table class="data-table">
        <caption class="sr-only">Demo patient records and current admission status</caption>
        <thead>
          <tr>
            <th>#</th><th>Name</th><th>Contact</th><th>Status</th><th>Current room</th><th>Admissions</th><th class="text-right">Action</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="hidden empty-note py-10 text-center">No patients match your search.</p>
    </div>
  </main>

  <script type="module" src="js/patients.js"></script>
</body>
</html>
